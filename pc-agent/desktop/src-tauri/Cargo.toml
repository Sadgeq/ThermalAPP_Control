[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-oauth = "2"
# Saves window size/position/maximized state across launches. Without this,
# every restart resets to the default 1100x750. Zero-config plugin.
tauri-plugin-window-state = "2"
# Updater plugin: enables in-app prompts for new releases. Inert until you
# (a) generate a key pair via `npm run tauri signer generate`, (b) set the
# pubkey in tauri.conf.json under plugins.updater.pubkey, and (c) point
# plugins.updater.endpoints at your GitHub Releases manifest. See Phase 4
# in MANUAL_FOLLOWUPS.md for the rest of the wire-up.
tauri-plugin-updater = "2"
